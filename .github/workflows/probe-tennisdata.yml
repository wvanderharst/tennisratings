# One-off: look at what results.tennisdata.com serves for one match page (robots.txt, data requests). Output in the log.
name: Probe tennisdata.com
on:
  workflow_dispatch:
    inputs:
      url: { description: "Match page", default: "https://results.tennisdata.com/en/results/ecef0cbb-a99e-49ad-88a3-e529b18065ee" }
  push:
    paths: [".github/workflows/probe-tennisdata.yml", "tools/probe_tennisdata.py"]
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright==1.47.0 && python -m playwright install --with-deps chromium
      - run: python tools/probe_tennisdata.py ${{ inputs.url }}
