# One-off: is the match data inside the plain HTML of one results.tennisdata.com page? Output in the log.
name: Probe data sources
on:
  workflow_dispatch:
    inputs:
      url: { description: "Match page", default: "https://results.tennisdata.com/en/results/ecef0cbb-a99e-49ad-88a3-e529b18065ee" }
  push:
    paths: [".github/workflows/probe-tennisdata.yml", "tools/probe_*.py"]
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python tools/probe_draws.py
